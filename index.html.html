<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bank Soal — Kuis Pilihan Ganda</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --gold-900:#5c4610; --gold-800:#7a5c14; --gold-700:#96721a; --gold-600:#b78d24;
    --gold-500:#d4a72f; --gold-400:#e6c04f; --gold-300:#f2d778; --gold-100:#faedc0;
    --maroon:#7a2028; --maroon-dark:#5a1620;
    --green:#2f6d3b; --green-bg:#e6f2e6;
    --red:#a33131; --red-bg:#f7e6e3;
    --ink:#2b2113; --ink-soft:#5c5240;
    --paper:#fdf9ee; --paper-raised:#fffdf6;
    --line: rgba(43,33,19,0.14);
    --shadow: 0 1px 2px rgba(43,33,19,0.06);
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box;}
  html{scroll-padding-top:env(safe-area-inset-top,0px);}
  html,body{height:100%;}
  body{
    margin:0;
    background:
      radial-gradient(1100px 480px at 12% -10%, rgba(212,167,47,0.16), transparent 60%),
      radial-gradient(900px 420px at 100% 0%, rgba(122,32,40,0.07), transparent 55%),
      var(--paper);
    background-attachment:fixed;
    color:var(--ink);
    font-family:"Public Sans", system-ui, sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper:#1c150a; --paper-raised:#241b0e; --ink:#f3e9d2; --ink-soft:#c9bb98;
      --line: rgba(243,233,210,0.14); --gold-100:#3a2b0e;
      --green-bg:#173a1f; --red-bg:#3a1c17;
    }
  }
  :root[data-theme="dark"]{
    --paper:#1c150a; --paper-raised:#241b0e; --ink:#f3e9d2; --ink-soft:#c9bb98;
    --line: rgba(243,233,210,0.14); --gold-100:#3a2b0e;
    --green-bg:#173a1f; --red-bg:#3a1c17;
  }

  a{color:inherit;}
  ::selection{background:var(--gold-300); color:var(--ink);}
  .wrap{max-width:880px; margin:0 auto; padding:0 24px;}

  /* ---------- Header ---------- */
  header.hero{ padding:56px 0 32px; border-bottom:1px solid var(--line); }
  .crest{
    width:56px; height:56px; flex:none; border-radius:50%;
    background: conic-gradient(from 220deg, var(--gold-300), var(--gold-600) 30%, var(--gold-400) 55%, var(--gold-600) 80%, var(--gold-300));
    display:flex; align-items:center; justify-content:center;
    box-shadow: 0 0 0 3px var(--paper), 0 0 0 4px var(--gold-500), var(--shadow);
  }
  .crest svg{width:28px; height:28px;}
  .hero-top{display:flex; align-items:center; gap:16px;}
  .hero-eyebrow{ font-size:13px; color:var(--maroon); font-weight:600; margin:0 0 4px; }
  .hero h1{
    font-family:"Fraunces", serif; font-weight:600;
    font-size:clamp(30px, 5vw, 44px); line-height:1.08; margin:0; color:var(--ink);
  }
  .hero p.lede{ max-width:60ch; margin:16px 0 0; font-size:16px; line-height:1.65; color:var(--ink-soft); }

  /* ---------- Score bar ---------- */
  .scorebar{
    position:sticky; top:0; z-index:6;
    background:var(--paper);
    border-bottom:1px solid var(--line);
    padding:14px 0;
  }
  .scorebar-inner{ display:flex; align-items:center; gap:22px; flex-wrap:wrap; }
  .sb-stat{ display:flex; flex-direction:column; }
  .sb-stat b{ font-family:"Fraunces", serif; font-size:22px; font-weight:600; color:var(--maroon); line-height:1.1; }
  .sb-stat span{ font-size:12px; color:var(--ink-soft); }
  .sb-bar{ flex:1; min-width:120px; height:8px; background:var(--gold-100); border-radius:99px; overflow:hidden; }
  .sb-bar-fill{ height:100%; background:var(--maroon); width:0%; transition:width .3s ease; }
  .btn-reset{
    margin-left:auto; flex:none;
    font:inherit; font-size:13px; font-weight:600;
    background:transparent; color:var(--maroon);
    border:1px solid var(--maroon); border-radius:8px;
    padding:8px 14px; cursor:pointer;
  }
  .btn-reset:hover{ background:var(--maroon); color:var(--gold-100); }

  /* ---------- Search / Tabs ---------- */
  .controls{ padding:18px 0 4px; }
  .search{
    display:flex; align-items:center; gap:10px;
    background:var(--paper-raised); border:1px solid var(--line); border-radius:12px;
    padding:12px 16px; box-shadow:var(--shadow);
  }
  .search svg{ flex:none; opacity:0.55; }
  .search input{ border:none; outline:none; background:transparent; font:inherit; font-size:15px; color:var(--ink); width:100%; }
  .search input::placeholder{ color:var(--ink-soft); }
  .tabs{ display:flex; gap:8px; margin-top:14px; overflow-x:auto; padding-bottom:2px; scrollbar-width:none; }
  .tabs::-webkit-scrollbar{ display:none; }
  .tab{
    flex:none; font:inherit; font-size:13.5px; font-weight:600; color:var(--ink-soft);
    background:transparent; border:1px solid var(--line); padding:8px 14px; border-radius:999px;
    cursor:pointer; white-space:nowrap; transition:background .15s ease, color .15s ease, border-color .15s ease;
  }
  .tab .count{ opacity:0.65; font-weight:500; margin-left:4px; }
  .tab:hover{ border-color:var(--gold-600); }
  .tab.active{ background:var(--maroon); border-color:var(--maroon); color:var(--gold-100); }

  /* ---------- Sections & questions ---------- */
  main{ padding:8px 0 80px; }
  .section-block{ margin-top:44px; }
  .section-head{
    display:flex; align-items:baseline; gap:12px;
    border-bottom:2px solid var(--gold-500); padding-bottom:10px; margin-bottom:18px;
  }
  .section-head h2{ font-family:"Fraunces", serif; font-weight:600; font-size:22px; margin:0; color:var(--ink); }
  .section-head .tally{ font-size:13px; color:var(--ink-soft); margin-left:auto; }

  .qcard{
    border:1px solid var(--line); border-radius:12px; background:var(--paper-raised);
    margin-bottom:16px; box-shadow:var(--shadow); padding:18px;
  }
  .qcard-top{ display:flex; align-items:flex-start; gap:14px; margin-bottom:14px; }
  .qa-num{
    flex:none; font-family:"Fraunces", serif; font-weight:600; font-size:14px;
    color:var(--maroon); background:var(--gold-100); border:1px solid var(--gold-500);
    width:28px; height:28px; border-radius:50%; display:flex; align-items:center; justify-content:center;
  }
  .qcard-q{ flex:1; font-size:15.5px; font-weight:600; line-height:1.5; padding-top:3px; }

  .options{ display:flex; flex-direction:column; gap:8px; margin-left:42px; }
  .opt{
    display:flex; align-items:center; gap:12px; text-align:left;
    border:1px solid var(--line); border-radius:9px; background:var(--paper);
    padding:11px 14px; font:inherit; font-size:14.5px; color:var(--ink);
    cursor:pointer; transition:border-color .15s ease, background .15s ease;
  }
  .opt:hover:not(.locked .opt){ border-color:var(--gold-600); }
  .opt-letter{
    flex:none; width:24px; height:24px; border-radius:50%;
    border:1px solid var(--line); display:flex; align-items:center; justify-content:center;
    font-size:12px; font-weight:700; color:var(--ink-soft);
  }
  .qcard.locked .opt{ cursor:default; }
  .qcard.locked .opt.correct{ background:var(--green-bg); border-color:var(--green); }
  .qcard.locked .opt.correct .opt-letter{ background:var(--green); border-color:var(--green); color:#fff; }
  .qcard.locked .opt.wrong{ background:var(--red-bg); border-color:var(--red); }
  .qcard.locked .opt.wrong .opt-letter{ background:var(--red); border-color:var(--red); color:#fff; }
  .qcard.locked .opt:not(.correct):not(.wrong){ opacity:0.55; }

  .result-tag{
    margin-left:42px; margin-top:12px; display:none;
    align-items:center; gap:8px; font-size:13.5px; font-weight:600; padding:8px 12px;
    border-radius:8px;
  }
  .qcard.locked .result-tag{ display:flex; }
  .result-tag.ok{ background:var(--green-bg); color:var(--green); }
  .result-tag.no{ background:var(--red-bg); color:var(--red); }

  .explanation{
    margin-left:42px; margin-top:8px; display:none;
    font-size:14px; line-height:1.65; color:var(--ink-soft);
    border-top:1px dashed var(--line); padding-top:10px;
  }
  .qcard.locked .explanation{ display:block; }
  .explanation b{ color:var(--ink); font-weight:600; }

  .empty{ text-align:center; padding:60px 20px; color:var(--ink-soft); }
  .empty b{ display:block; font-family:"Fraunces", serif; font-size:20px; color:var(--ink); margin-bottom:6px; font-weight:600; }

  footer{ border-top:1px solid var(--line); padding:26px 0 calc(26px + env(safe-area-inset-bottom,0px)); text-align:center; color:var(--ink-soft); font-size:13px; }

  @media (max-width:560px){
    .hero{ padding:40px 0 24px; }
    .options, .result-tag, .explanation{ margin-left:0; }
  }
</style>
</head>
<body>

<header class="hero">
  <div class="wrap">
    <div class="hero-top">
      <div class="crest">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 2v20M6 6l-4 8a4 4 0 0 0 8 0L6 6zM18 6l-4 8a4 4 0 0 0 8 0l-4-8zM3 6h6M15 6h6M9 6h6" stroke="#3a2308" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <div>
        <p class="hero-eyebrow">Bank Soal</p>
        <h1>Kuis Pilihan Ganda</h1>
      </div>
    </div>
    <p class="lede">Pilih salah satu jawaban di tiap soal — hasilnya langsung kelihatan benar atau salah, dan skor totalmu terhitung otomatis di atas.</p>
  </div>
</header>

<div class="scorebar">
  <div class="wrap scorebar-inner">
    <div class="sb-stat"><b id="sbAnswered">0/0</b><span>Terjawab</span></div>
    <div class="sb-stat"><b id="sbCorrect">0</b><span>Benar</span></div>
    <div class="sb-stat"><b id="sbScore">0%</b><span>Skor</span></div>
    <div class="sb-bar"><div class="sb-bar-fill" id="sbBarFill"></div></div>
    <button class="btn-reset" id="btnReset">Ulangi Kuis</button>
  </div>
</div>

<div class="controls">
  <div class="wrap">
    <label class="search">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="1.8"/><path d="m20 20-3.5-3.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      <input id="searchInput" type="text" placeholder="Cari pertanyaan…">
    </label>
    <div class="tabs" id="tabs"></div>
  </div>
</div>

<main class="wrap" id="main"></main>

<footer>Bank soal ini contoh awal — ganti pertanyaan, pilihan, dan kunci jawabannya di kode sesuai kebutuhanmu.</footer>

<script>
/* Setiap soal: q = pertanyaan, options = 4 pilihan, correct = index jawaban benar (0-3), explanation = pembahasan */
const DATA = [
  {
    id: "pengetahuan-umum",
    title: "Pengetahuan Umum Kelembagaan",
    questions: [
      {
        q: "Mahkamah Agung berwenang mengadili perkara pada tingkat...",
        options: ["Pertama", "Banding", "Kasasi", "Peninjauan awal"],
        correct: 2,
        explanation: "Mahkamah Agung adalah <b>pengadilan tingkat kasasi tertinggi</b>, selain juga berwenang mengadili sengketa kewenangan mengadili dan peninjauan kembali."
      },
      {
        q: "Berikut yang BUKAN termasuk lingkungan peradilan di bawah Mahkamah Agung adalah...",
        options: ["Peradilan Umum", "Peradilan Agama", "Peradilan Tata Usaha Negara", "Peradilan Konstitusi"],
        correct: 3,
        explanation: "Peradilan Konstitusi bukan berada di bawah MA — kewenangan itu ada pada <b>Mahkamah Konstitusi</b>. Empat lingkungan di bawah MA: Umum, Agama, Militer, dan PTUN."
      },
      {
        q: "Asas 'peradilan sederhana, cepat, biaya ringan' bertujuan agar proses hukum...",
        options: [
          "Selalu diputus dalam satu hari",
          "Tidak berbelit-belit dan tidak membebani pencari keadilan",
          "Hanya boleh dilakukan oleh pengacara",
          "Tidak memerlukan bukti tertulis"
        ],
        correct: 1,
        explanation: "Asas ini menekankan efisiensi waktu dan biaya yang <b>wajar dan proporsional</b> bagi pencari keadilan, bukan soal jangka waktu mutlak satu hari."
      }
    ]
  },
  {
    id: "hukum-acara-perdata",
    title: "Hukum Acara Perdata",
    questions: [
      {
        q: "Perkara yang diajukan tanpa adanya pihak lawan disebut...",
        options: ["Gugatan", "Permohonan (voluntair)", "Replik", "Konvensi"],
        correct: 1,
        explanation: "Permohonan bersifat <b>voluntair</b> (tanpa sengketa), hasilnya berupa penetapan — berbeda dari gugatan yang bersifat contentiosa dan menghasilkan putusan."
      },
      {
        q: "Bantahan tergugat yang tidak menyangkut pokok perkara disebut...",
        options: ["Replik", "Duplik", "Eksepsi", "Konklusi"],
        correct: 2,
        explanation: "Eksepsi adalah bantahan di luar pokok perkara, misalnya <b>eksepsi kompetensi absolut/relatif</b> atau gugatan kabur (obscuur libel)."
      },
      {
        q: "Upaya hukum kasasi diajukan terhadap putusan...",
        options: [
          "Tingkat pertama yang belum diputus",
          "Tingkat terakhir dari pengadilan selain Mahkamah Agung",
          "Yang sudah berkekuatan hukum tetap lebih dari 5 tahun",
          "Pengadilan luar negeri"
        ],
        correct: 1,
        explanation: "Kasasi ditujukan pada putusan <b>tingkat terakhir</b> pengadilan di bawah MA, dengan alasan kesalahan penerapan hukum atau kewenangan mengadili."
      }
    ]
  },
  {
    id: "hukum-acara-pidana",
    title: "Hukum Acara Pidana",
    questions: [
      {
        q: "Urutan proses peradilan pidana yang tepat adalah...",
        options: [
          "Penuntutan → Penyidikan → Persidangan → Putusan",
          "Penyelidikan → Penyidikan → Penuntutan → Persidangan → Putusan",
          "Putusan → Persidangan → Penyidikan",
          "Penyidikan → Putusan → Penuntutan"
        ],
        correct: 1,
        explanation: "Urutan bakunya: <b>penyelidikan → penyidikan → penuntutan → persidangan → putusan</b>, baru dilanjutkan upaya hukum bila diperlukan."
      },
      {
        q: "Asas praduga tak bersalah berarti seseorang...",
        options: [
          "Langsung dianggap bersalah saat ditangkap",
          "Dianggap tidak bersalah sampai ada putusan berkekuatan hukum tetap",
          "Tidak berhak didampingi pengacara",
          "Wajib mengaku bersalah di persidangan"
        ],
        correct: 1,
        explanation: "Presumption of innocence menegaskan status <b>tidak bersalah</b> tetap melekat hingga ada putusan pengadilan yang inkrah."
      },
      {
        q: "Benda fisik yang berkaitan langsung dengan tindak pidana disebut...",
        options: ["Alat bukti", "Barang bukti", "Petunjuk", "Yurisprudensi"],
        correct: 1,
        explanation: "Barang bukti adalah <b>objek fisik</b> terkait tindak pidana, berbeda dari alat bukti yang merupakan sarana sah pembuktian menurut undang-undang."
      }
    ]
  },
  {
    id: "etika-integritas",
    title: "Etika & Integritas Aparatur",
    questions: [
      {
        q: "Situasi ketika kepentingan pribadi berpotensi memengaruhi objektivitas keputusan disebut...",
        options: ["Konflik kepentingan", "Kode etik", "Disiplin pegawai", "Mutasi jabatan"],
        correct: 0,
        explanation: "Conflict of interest wajib <b>diungkapkan dan dihindari</b> agar keputusan tetap objektif dan bebas dari kepentingan pribadi."
      },
      {
        q: "Kepercayaan publik terhadap lembaga peradilan paling bergantung pada...",
        options: [
          "Jumlah gedung pengadilan",
          "Independensi dan integritas aparaturnya",
          "Kecepatan akses jalan ke pengadilan",
          "Banyaknya perkara yang masuk"
        ],
        correct: 1,
        explanation: "Independensi dan integritas adalah fondasi <b>kepercayaan publik</b> terhadap keadilan yang dihasilkan lembaga peradilan."
      }
    ]
  },
  {
    id: "bahasa-indonesia",
    title: "Bahasa Indonesia & Penalaran",
    questions: [
      {
        q: "Penulisan baku yang tepat adalah...",
        options: ["menindak lanjuti", "menindaklanjuti", "menindak-lanjuti", "tindaklanjuti"],
        correct: 1,
        explanation: "Ditulis serangkai <b>'menindaklanjuti'</b> karena berasal dari bentuk dasar 'tindak lanjut' yang mendapat konfiks me-...-i."
      },
      {
        q: "Hakim : Palu = Notaris : ...",
        options: ["Meja", "Akta", "Kursi", "Gedung"],
        correct: 1,
        explanation: "Palu adalah simbol/alat kerja hakim, sebagaimana <b>akta</b> adalah produk/alat kerja utama seorang notaris."
      }
    ]
  }
];

const mainEl = document.getElementById('main');
const tabsEl = document.getElementById('tabs');
const searchInput = document.getElementById('searchInput');
const btnReset = document.getElementById('btnReset');

let activeTab = 'all';
let answers = {}; // key: `${sectionId}__${qIndex}` -> selected option index

function totalQuestions(){
  return DATA.reduce((sum, s) => sum + s.questions.length, 0);
}

function computeStats(){
  const keys = Object.keys(answers);
  const answered = keys.length;
  let correct = 0;
  DATA.forEach(section => {
    section.questions.forEach((q, i) => {
      const key = section.id + '__' + i;
      if (answers[key] !== undefined && answers[key] === q.correct) correct++;
    });
  });
  return { answered, correct, total: totalQuestions() };
}

function updateScorebar(){
  const { answered, correct, total } = computeStats();
  document.getElementById('sbAnswered').textContent = `${answered}/${total}`;
  document.getElementById('sbCorrect').textContent = correct;
  const pct = total ? Math.round((correct / total) * 100) : 0;
  document.getElementById('sbScore').textContent = pct + '%';
  document.getElementById('sbBarFill').style.width = pct + '%';
}

function buildTabs(){
  tabsEl.innerHTML = '';
  const allBtn = document.createElement('button');
  allBtn.className = 'tab active';
  allBtn.dataset.id = 'all';
  allBtn.innerHTML = `Semua <span class="count">${totalQuestions()}</span>`;
  tabsEl.appendChild(allBtn);

  DATA.forEach(section => {
    const btn = document.createElement('button');
    btn.className = 'tab';
    btn.dataset.id = section.id;
    btn.innerHTML = `${section.title} <span class="count">${section.questions.length}</span>`;
    tabsEl.appendChild(btn);
  });

  tabsEl.addEventListener('click', (e) => {
    const btn = e.target.closest('.tab');
    if (!btn) return;
    activeTab = btn.dataset.id;
    [...tabsEl.children].forEach(c => c.classList.toggle('active', c === btn));
    render();
  });
}

const letters = ['A', 'B', 'C', 'D', 'E', 'F'];

function render(){
  const term = searchInput.value.trim().toLowerCase();
  mainEl.innerHTML = '';
  let shown = 0;

  const sectionsToRender = activeTab === 'all' ? DATA : DATA.filter(s => s.id === activeTab);

  sectionsToRender.forEach(section => {
    const filtered = section.questions
      .map((q, i) => ({ ...q, idx: i }))
      .filter(q => !term || q.q.toLowerCase().includes(term));

    if (filtered.length === 0) return;
    shown += filtered.length;

    const block = document.createElement('section');
    block.className = 'section-block';

    const head = document.createElement('div');
    head.className = 'section-head';
    head.innerHTML = `<h2>${section.title}</h2><span class="tally">${filtered.length} soal</span>`;
    block.appendChild(head);

    filtered.forEach(q => {
      const key = section.id + '__' + q.idx;
      const selected = answers[key];
      const locked = selected !== undefined;

      const card = document.createElement('div');
      card.className = 'qcard' + (locked ? ' locked' : '');

      const optionsHtml = q.options.map((opt, oi) => {
        let cls = 'opt';
        if (locked) {
          if (oi === q.correct) cls += ' correct';
          else if (oi === selected) cls += ' wrong';
        }
        return `<button class="${cls}" data-oi="${oi}">
          <span class="opt-letter">${letters[oi]}</span><span>${opt}</span>
        </button>`;
      }).join('');

      const isCorrect = locked && selected === q.correct;

      card.innerHTML = `
        <div class="qcard-top">
          <span class="qa-num">${q.idx + 1}</span>
          <span class="qcard-q">${q.q}</span>
        </div>
        <div class="options">${optionsHtml}</div>
        <div class="result-tag ${isCorrect ? 'ok' : 'no'}">${isCorrect ? '✓ Jawaban benar' : '✕ Jawaban kurang tepat'}</div>
        <div class="explanation">${q.explanation || ''}</div>
      `;

      if (!locked) {
        card.querySelectorAll('.opt').forEach(optBtn => {
          optBtn.addEventListener('click', () => {
            answers[key] = parseInt(optBtn.dataset.oi, 10);
            updateScorebar();
            render();
          });
        });
      }

      block.appendChild(card);
    });

    mainEl.appendChild(block);
  });

  if (shown === 0) {
    mainEl.innerHTML = `<div class="empty"><b>Tidak ada soal ditemukan</b>Coba kata kunci lain atau pilih kategori berbeda.</div>`;
  }
}

btnReset.addEventListener('click', () => {
  answers = {};
